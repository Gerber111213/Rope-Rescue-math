<body>
    <header>
        <h1><a href="../index.html">Canadian Technical Rescue Hub</a></h1>
        <div class="header-nav">
            <a class="nav-pill" href="../index.html">← Rescue Hub</a>

                Knots &amp; CMC Anchors
            </span>
        </div>
    </header>

    <main>
        <div class="hero-bar">
            <div>
                <h2 style="color: var(--accent-cyan); font-size: 1.38rem;">Rope Diagrams &amp; 3-Phase Tying Lessons</h2>
                <p style="color: var(--text-muted); font-size: 0.89rem;">
                    Shaded kernmantle rope renders with over/under weave depth, 3-phase tying lessons, and CMC rescue anchors.
                </p>
            </div>
            <div class="legend-strip">
                <span><i class="swatch" style="background:#38bdf8;"></i>Standing / Main Rope</span>
                <span><i class="swatch" style="background:#f59e0b;"></i>Working / Secondary Rope</span>
                <span><i class="swatch" style="background:#22c55e;"></i>Dressed / Load-Bearing</span>
            </div>
        </div>

        <div class="controls-row">
            <div class="tab-pills" id="sectionTabs">
                <button class="pill-btn active" onclick="setFilter('all', this)">All Lessons (11)</button>
                <button class="pill-btn" onclick="setFilter('fig8', this)">Figure-8 Family (4)</button>
                <button class="pill-btn" onclick="setFilter('bends-loops', this)">Butterfly &amp; Fisherman's (2)</button>
                <button class="pill-btn" onclick="setFilter('bowlines', this)">Bowlines &amp; Litter (2)</button>
                <button class="pill-btn" onclick="setFilter('anchors', this)">CMC Anchors (3)</button>
            </div>
            <input type="text" id="searchInput" class="filter-input" placeholder="Filter by knot, litter, anchor..." oninput="renderLessons()">
        </div>

        <div class="module-grid" id="lessonsGrid"></div>
    </main>

    <script>
        const PALETTES = {
            blue:   { dark: '#032c47', base: '#0ea5e9', light: '#bae6fd', braid: '#0284c7' },
            amber:  { dark: '#451a03', base: '#f59e0b', light: '#fef08a', braid: '#d97706' },
            green:  { dark: '#052e16', base: '#22c55e', light: '#bbf7d0', braid: '#16a34a' },
            slate:  { dark: '#1e293b', base: '#94a3b8', light: '#f1f5f9', braid: '#64748b' }
        };

        // Evaluates a cubic Bézier curve at t in [0, 1]
        function cubicPt(p0, p1, p2, p3, t) {
            const u = 1 - t;
            const tt = t * t, uu = u * u;
            const uuu = uu * u, ttt = tt * t;
            return {
                x: uuu * p0[0] + 3 * uu * t * p1[0] + 3 * u * tt * p2[0] + ttt * p3[0],
                y: uuu * p0[1] + 3 * uu * t * p1[1] + 3 * u * tt * p2[1] + ttt * p3[1]
            };
        }

        // Converts a list of cubic Bézier segments into dense polyline points with depth z
        function sampleSplines(segments, stepsPerSeg = 28) {
            const pts = [];
            segments.forEach(seg => {
                const zStart = seg.z0 ?? 0;
                const zEnd = seg.z1 ?? zStart;
                for (let i = 0; i <= stepsPerSeg; i++) {
                    const t = i / stepsPerSeg;
                    const p = cubicPt(seg.p0, seg.p1, seg.p2, seg.p3, t);
                    pts.push({ x: p.x, y: p.y, z: zStart + (zEnd - zStart) * t });
                }
            });
            return pts;
        }

        function lineToSeg(x1, y1, x2, y2, z0 = 0, z1 = z0) {
            return {
                p0: [x1, y1],
                p1: [x1 + (x2 - x1) / 3, y1 + (y2 - y1) / 3],
                p2: [x1 + (2 * (x2 - x1)) / 3, y1 + (2 * (y2 - y1)) / 3],
                p3: [x2, y2],
                z0,
                z1
            };
        }

        function circleSegs(cx, cy, rx, ry, startRad, endRad, z0 = 0, z1 = z0, pieces = 4) {
            const segs = [];
            const total = endRad - startRad;
            for (let i = 0; i < pieces; i++) {
                const a0 = startRad + (total * i) / pieces;
                const a1 = startRad + (total * (i + 1)) / pieces;
                const da = a1 - a0;
                const k = (4 / 3) * Math.tan(da / 4);
                const x0 = cx + rx * Math.cos(a0), y0 = cy + ry * Math.sin(a0);
                const x3 = cx + rx * Math.cos(a1), y3 = cy + ry * Math.sin(a1);
                const x1 = x0 - k * rx * Math.sin(a0), y1 = y0 + k * ry * Math.cos(a0);
                const x2 = x3 + k * rx * Math.sin(a1), y2 = y3 - k * ry * Math.cos(a1);
                segs.push({
                    p0: [x0, y0], p1: [x1, y1], p2: [x2, y2], p3: [x3, y3],
                    z0: z0 + ((z1 - z0) * i) / pieces,
                    z1: z0 + ((z1 - z0) * (i + 1)) / pieces
                });
            }
            return segs;
        }

        // Draws shaded 3D cylindrical kernmantle rope segments sorted back-to-front by z
        function drawTubularRopes(ctx, strands, scaleX = 1, scaleY = 1) {
            const chunks = [];
            strands.forEach(strand => {
                const pal = PALETTES[strand.color] || PALETTES.blue;
                const radius = (strand.width || 9) * 0.5 * Math.min(scaleX, scaleY);
                const pts = strand.pts.map(p => ({ x: p.x * scaleX, y: p.y * scaleY, z: p.z || 0 }));

                for (let i = 0; i < pts.length - 1; i++) {
                    const a = pts[i], b = pts[i + 1];
                    const dx = b.x - a.x, dy = b.y - a.y;
                    const len = Math.hypot(dx, dy);
                    if (len < 0.25) continue;
                    const nx = -dy / len, ny = dx / len;
                    const zMid = (a.z + b.z) * 0.5;
                    chunks.push({ a, b, nx, ny, len, radius, pal, idx: i, z: zMid });
                }
            });

            chunks.sort((u, v) => u.z - v.z);

            chunks.forEach(c => {
                const { a, b, nx, ny, radius, pal, idx } = c;
                ctx.lineCap = 'round';

                // 1. Contact drop shadow / dark edge sheath
                ctx.beginPath();
                ctx.moveTo(a.x, a.y);
                ctx.lineTo(b.x, b.y);
                ctx.strokeStyle = '#020617';
                ctx.lineWidth = radius * 2 + 2.6;
                ctx.stroke();

                // 2. Dark core/edge tone
                ctx.beginPath();
                ctx.moveTo(a.x, a.y);
                ctx.lineTo(b.x, b.y);
                ctx.strokeStyle = pal.dark;
                ctx.lineWidth = radius * 2;
                ctx.stroke();

                // 3. Main colored kernmantle sheath
                ctx.beginPath();
                ctx.moveTo(a.x, a.y);
                ctx.lineTo(b.x, b.y);
                ctx.strokeStyle = pal.base;
                ctx.lineWidth = radius * 1.56;
                ctx.stroke();

                // 4. Specular highlight along top-left lit side of the cylinder
                const hOff = radius * 0.34;
                ctx.beginPath();
                ctx.moveTo(a.x + nx * hOff - hOff * 0.4, a.y + ny * hOff - hOff * 0.4);
                ctx.lineTo(b.x + nx * hOff - hOff * 0.4, b.y + ny * hOff - hOff * 0.4);
                ctx.strokeStyle = pal.light;
                ctx.lineWidth = Math.max(1.2, radius * 0.42);
                ctx.stroke();

                // 5. Subtle diagonal braided sheath ticks every few steps
                if (idx % 3 === 0) {
                    const mx = (a.x + b.x) * 0.5, my = (a.y + b.y) * 0.5;
                    const tx = (b.x - a.x) / c.len, ty = (b.y - a.y) / c.len;
                    const rx = tx * 0.55 + nx * 0.83;
                    const ry = ty * 0.55 + ny * 0.83;
                    ctx.beginPath();
                    ctx.moveTo(mx - rx * radius * 0.72, my - ry * radius * 0.72);
                    ctx.lineTo(mx + rx * radius * 0.72, my + ry * radius * 0.72);
                    ctx.strokeStyle = pal.braid;
                    ctx.lineWidth = Math.max(1, radius * 0.24);
                    ctx.stroke();
                }
            });
        }

        function drawWoodPost(ctx, x, y, w, h, sx, sy) {
            const px = x * sx, py = y * sy, pw = w * sx, ph = h * sy;
            const grad = ctx.createLinearGradient(px, py, px + pw, py);
            grad.addColorStop(0, '#291004');
            grad.addColorStop(0.35, '#78350f');
            grad.addColorStop(0.75, '#451a03');
            grad.addColorStop(1, '#1c0a02');
            ctx.fillStyle = grad;
            ctx.beginPath();
            ctx.roundRect(px, py, pw, ph, 5 * Math.min(sx, sy));
            ctx.fill();
            ctx.strokeStyle = '#92400e';
            ctx.lineWidth = 1.5;
            ctx.stroke();
        }

        function drawLockingBiner(ctx, x, y, sx, sy) {
            const bx = x * sx, by = y * sy, r = Math.min(sx, sy);
            ctx.save();
            ctx.translate(bx, by);
            ctx.strokeStyle = '#cbd5e1';
            ctx.lineWidth = 3.2 * r;
            ctx.beginPath();
            ctx.roundRect(-9 * r, -14 * r, 18 * r, 28 * r, 7 * r);
            ctx.stroke();
            ctx.strokeStyle = '#facc15';
            ctx.lineWidth = 2 * r;
            ctx.beginPath();
            ctx.moveTo(9 * r, -6 * r);
            ctx.lineTo(9 * r, 6 * r);
            ctx.stroke();
            ctx.restore();
        }

        function drawStopperBall(ctx, x, y, color, sx, sy) {
            const pal = PALETTES[color] || PALETTES.green;
            const bx = x * sx, by = y * sy, rad = 6.5 * Math.min(sx, sy);
            const g = ctx.createRadialGradient(bx - rad * 0.35, by - rad * 0.35, rad * 0.15, bx, by, rad);
            g.addColorStop(0, pal.light);
            g.addColorStop(0.55, pal.base);
            g.addColorStop(1, pal.dark);
            ctx.fillStyle = g;
            ctx.beginPath();
            ctx.arc(bx, by, rad, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = '#020617';
            ctx.lineWidth = 1.6;
            ctx.stroke();
        }

        // Parametric knot builders (coordinates in a 400x185 logical space)
        const knotBuilders = {
            // 1. Figure-8 on a Bight
            'fig8-bight': {
                hero(ctx, sx, sy) {
                    drawTubularRopes(ctx, [
                        { color: 'blue', width: 11, pts: sampleSplines([lineToSeg(25, 136, 130, 96, 1)]) },
                        { color: 'amber', width: 11, pts: sampleSplines([lineToSeg(25, 48, 130, 88, 1)]) },
                        // Lower loop of figure-8 (under crossing at x=165, y=92)
                        { color: 'green', width: 11, pts: sampleSplines([
                            ...circleSegs(166, 114, 28, 22, Math.PI * 0.9, Math.PI * 2.15, 0, 2, 6)
                        ])},
                        // Upper loop of figure-8 (over crossing)
                        { color: 'green', width: 11, pts: sampleSplines([
                            ...circleSegs(166, 70, 28, 22, -Math.PI * 0.15, Math.PI * 1.1, 3, 1, 6)
                        ])},
                        // Bight exit loop to right
                        { color: 'green', width: 11, pts: sampleSplines([
                            lineToSeg(194, 76, 338, 76, 2, 2),
                            ...circleSegs(338, 94, 22, 18, -Math.PI * 0.5, Math.PI * 0.5, 2, 2, 5),
                            lineToSeg(338, 112, 194, 112, 2, 2)
                        ])}
                    ], sx, sy);
                },
                phases: [
                    (ctx, sx, sy) => drawTubularRopes(ctx, [
                        { color: 'blue', width: 9, pts: sampleSplines([lineToSeg(18, 128, 115, 92, 1)]) },
                        { color: 'amber', width: 9, pts: sampleSplines([lineToSeg(18, 56, 115, 92, 1)]) },
                        { color: 'amber', width: 9, pts: sampleSplines(circleSegs(162, 92, 34, 34, Math.PI, Math.PI * 2.75, 0, 3, 6)) }
                    ], sx, sy),
                    (ctx, sx, sy) => drawTubularRopes(ctx, [
                        { color: 'blue', width: 9, pts: sampleSplines([lineToSeg(18, 126, 115, 92, 1)]) },
                        { color: 'amber', width: 9, pts: sampleSplines([lineToSeg(18, 58, 115, 92, 1)]) },
                        { color: 'green', width: 9, pts: sampleSplines([
                            ...circleSegs(165, 112, 26, 20, Math.PI * 0.9, Math.PI * 2.1, 0, 2, 5),
                            ...circleSegs(165, 72, 26, 20, -Math.PI * 0.1, Math.PI * 1.1, 3, 1, 5)
                        ])}
                    ], sx, sy),
                    (ctx, sx, sy) => drawTubularRopes(ctx, [
                        { color: 'blue', width: 9, pts: sampleSplines([lineToSeg(18, 124, 118, 92, 1)]) },
                        { color: 'amber', width: 9, pts: sampleSplines([lineToSeg(18, 60, 118, 92, 1)]) },
                        { color: 'green', width: 9, pts: sampleSplines([
                            ...circleSegs(168, 112, 26, 19, Math.PI * 0.9, Math.PI * 2.1, 0, 2, 5),
                            ...circleSegs(168, 72, 26, 19, -Math.PI * 0.1, Math.PI * 1.1, 3, 1, 5),
                            lineToSeg(194, 80, 340, 80, 2, 2),
                            ...circleSegs(340, 93, 16, 13, -Math.PI * 0.5, Math.PI * 0.5, 2, 2, 4),
                            lineToSeg(340, 106, 194, 106, 2, 2)
                        ])}
                    ], sx, sy)
                ]
            },

            // 2. Figure-8 Follow-Through (Rewoven)
            'fig8-follow': {
                hero(ctx, sx, sy) {
                    // Anchor ring on left
                    ctx.strokeStyle = '#94a3b8';
                    ctx.lineWidth = 6 * Math.min(sx, sy);
                    ctx.beginPath();
                    ctx.arc(62 * sx, 92 * sy, 24 * Math.min(sx, sy), 0, Math.PI * 2);
                    ctx.stroke();

                    drawTubularRopes(ctx, [
                        { color: 'blue', width: 11, pts: sampleSplines([lineToSeg(365, 92, 215, 92, 1)]) },
                        // Rewoven figure-8 body
                        { color: 'green', width: 11, pts: sampleSplines([
                            ...circleSegs(185, 112, 25, 19, Math.PI * 0.9, Math.PI * 2.1, 0, 2, 5),
                            ...circleSegs(185, 72, 25, 19, -Math.PI * 0.1, Math.PI * 1.1, 3, 1, 5)
                        ])},
                        // Retracing amber strand running parallel inside
                        { color: 'amber', width: 8, pts: sampleSplines([
                            lineToSeg(185, 76, 84, 76, 3, 3),
                            ...circleSegs(84, 92, 18, 16, -Math.PI * 0.5, Math.PI * 0.5, 3, 3, 5),
                            lineToSeg(84, 108, 185, 108, 3, 3),
                            lineToSeg(210, 102, 275, 132, 3, 3)
                        ])}
                    ], sx, sy);
                    drawStopperBall(ctx, 278, 134, 'green', sx, sy);
                },
                phases: [
                    (ctx, sx, sy) => drawTubularRopes(ctx, [
                        { color: 'blue', width: 9, pts: sampleSplines([lineToSeg(350, 92, 175, 92, 1)]) },
                        { color: 'blue', width: 9, pts: sampleSplines([
                            ...circleSegs(150, 110, 22, 17, Math.PI * 0.9, Math.PI * 2.1, 0, 2, 4),
                            ...circleSegs(150, 74, 22, 17, -Math.PI * 0.1, Math.PI * 1.1, 3, 1, 4),
                            lineToSeg(128, 80, 45, 128, 2, 2)
                        ])}
                    ], sx, sy),
                    (ctx, sx, sy) => {
                        ctx.strokeStyle = '#94a3b8';
                        ctx.lineWidth = 4.5 * Math.min(sx, sy);
                        ctx.beginPath();
                        ctx.arc(62 * sx, 92 * sy, 18 * Math.min(sx, sy), 0, Math.PI * 2);
                        ctx.stroke();
                        drawTubularRopes(ctx, [
                            { color: 'blue', width: 9, pts: sampleSplines([lineToSeg(350, 92, 185, 92, 1)]) },
                            { color: 'green', width: 9, pts: sampleSplines([
                                ...circleSegs(160, 110, 22, 17, Math.PI * 0.9, Math.PI * 2.1, 0, 2, 4),
                                ...circleSegs(160, 74, 22, 17, -Math.PI * 0.1, Math.PI * 1.1, 3, 1, 4)
                            ])},
                            { color: 'amber', width: 7, pts: sampleSplines([
                                lineToSeg(80, 92, 160, 78, 3, 3),
                                lineToSeg(182, 96, 255, 132, 3, 3)
                            ])}
                        ], sx, sy);
                    },
                    (ctx, sx, sy) => {
                        ctx.strokeStyle = '#94a3b8';
                        ctx.lineWidth = 4.5 * Math.min(sx, sy);
                        ctx.beginPath();
                        ctx.arc(62 * sx, 92 * sy, 18 * Math.min(sx, sy), 0, Math.PI * 2);
                        ctx.stroke();
                        drawTubularRopes(ctx, [
                            { color: 'blue', width: 9, pts: sampleSplines([lineToSeg(350, 92, 185, 92, 1)]) },
                            { color: 'green', width: 9, pts: sampleSplines([
                                ...circleSegs(160, 110, 22, 17, Math.PI * 0.9, Math.PI * 2.1, 0, 2, 4),
                                ...circleSegs(160, 74, 22, 17, -Math.PI * 0.1, Math.PI * 1.1, 3, 1, 4)
                            ])},

        let currentGroup = 'all';

        function setFilter(group, btn) {
            currentGroup = group;
            document.querySelectorAll('#sectionTabs .pill-btn').forEach(b => b.classList.remove('active'));
            if (btn) btn.classList.add('active');
            renderLessons();
        }

        function paintCanvas(canvas, drawFn, logicalW, logicalH) {
            const dpr = window.devicePixelRatio || 1;
            const rect = canvas.getBoundingClientRect();
            const cssW = rect.width || logicalW;
            const cssH = rect.height || logicalH;
            canvas.width = Math.round(cssW * dpr);
            canvas.height = Math.round(cssH * dpr);

            const ctx = canvas.getContext('2d');
            ctx.save();
            ctx.scale(dpr, dpr);
            ctx.clearRect(0, 0, cssW, cssH);

            // Subtle studio grid
            ctx.strokeStyle = 'rgba(148, 163, 184, 0.06)';
            ctx.lineWidth = 1;
            for (let x = 0; x < cssW; x += 24) {
                ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, cssH); ctx.stroke();
            }
            for (let y = 0; y < cssH; y += 24) {
                ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(cssW, y); ctx.stroke();
            }

            const sx = cssW / logicalW;
            const sy = cssH / logicalH;
            drawFn(ctx, sx, sy);
            ctx.restore();
        }

        function renderLessons() {
            const q = (document.getElementById('searchInput').value || '').trim().toLowerCase();
            const grid = document.getElementById('lessonsGrid');

            const filtered = lessons.filter(item => {
                const matchGroup = currentGroup === 'all' || item.group === currentGroup;
                const matchText = !q ||
                    item.title.toLowerCase().includes(q) ||
                    item.summary.toLowerCase().includes(q) ||
                    item.note.toLowerCase().includes(q) ||
                    item.tag.toLowerCase().includes(q);
                return matchGroup && matchText;
            });

            if (filtered.length === 0) {
                grid.innerHTML = `<div class="card" style="grid-column:1/-1;"><p style="color:var(--text-muted);">No matching lessons found for "${q}".</p></div>`;
                return;
            }

            grid.innerHTML = filtered.map(item => `
                <article class="lesson-card">
                    <div class="lesson-header">
                        <h3 class="lesson-title">${item.title}</h3>
                        <span class="badge ${item.badgeClass}">${item.tag}</span>
                    </div>
                    <p class="lesson-summary">${item.summary}</p>

                    <div class="hero-render-box">
                        <canvas class="hero-canvas" id="hero-${item.id}" aria-label="${item.title} diagram"></canvas>
                        <div class="hero-render-caption">${item.heroCaption}</div>
                    </div>

                    <div class="phases-3">
                        ${item.phaseTexts.map((txt, idx) => `
                            <div class="phase-card">
                                <div class="phase-tag">Phase ${idx + 1}</div>
                                <canvas class="phase-canvas" id="phase-${item.id}-${idx}" aria-label="${item.title} Phase ${idx + 1}"></canvas>
                                <div class="phase-text">${txt}</div>
                            </div>
                        `).join('')}
                    </div>

                    <div class="rigging-note ${item.critical ? 'critical' : ''}">${item.note}</div>
                </article>
            `).join('');

            requestAnimationFrame(() => {
                filtered.forEach(item => {
                    const b = knotBuilders[item.id];
                    if (!b) return;
                    const heroCanvas = document.getElementById(`hero-${item.id}`);
                    if (heroCanvas) paintCanvas(heroCanvas, b.hero, 400, 185);
                    b.phases.forEach((pFn, idx) => {
                        const pCanvas = document.getElementById(`phase-${item.id}-${idx}`);
                        if (pCanvas) paintCanvas(pCanvas, pFn, 360, 140);
                    });
                });
            });
        }

        window.addEventListener('resize', () => {
            clearTimeout(window.__knotResizeTimer);
            window.__knotResizeTimer = setTimeout(renderLessons, 120);
        });

        renderLessons();
    </script>
